name: Harbor
options:
  bundleIdPrefix: app.harbor
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  HarborKit:
    path: Packages/HarborKit
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.20
  Textual:
    url: https://github.com/gonzalezreal/textual
    exactVersion: 0.5.0
targets:
  Harbor:
    type: application
    platform: iOS
    dependencies:
      - package: HarborKit
      - package: ZIPFoundation
      - package: Textual
    sources:
      - path: Sources
      - path: Runtime
        excludes: ["*.js"]
      - path: Runtime/madeira-jit.js
        buildPhase: resources
      - path: Resources/nls
        type: folder
        buildPhase: resources
      - path: Resources/aarch64-windows
        type: folder
        buildPhase: resources
      - path: Resources/prefix-template.tar.gz
        buildPhase: resources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: Harbor
        PRODUCT_BUNDLE_IDENTIFIER: app.harbor.cli
        INFOPLIST_FILE: Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Runtime/Harbor-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../out/$(PLATFORM_NAME)"
        OTHER_LDFLAGS: "-lntdll_unix -lwineserver -lwin32u_unix -lz -framework IOKit -Wl,-headerpad_max_install_names -Wl,-U,_winios_cursor_set -Wl,-U,_winios_cursor_show -Wl,-U,_winios_direct_cursor_clip -Wl,-U,_winios_direct_cursor_pos -Wl,-U,_winios_direct_cursor_reader -Wl,-U,_winios_direct_cursor_set -Wl,-U,_winios_direct_cursor_show -Wl,-U,_winios_direct_cursor_wanted -Wl,-U,_winios_direct_cursor_warp -Wl,-U,_winios_display_mode_changed -Wl,-U,_winios_dump_srcbits -Wl,-U,_winios_mouse_routing_enabled -Wl,-U,_winios_pCreateWindow -Wl,-U,_winios_pDestroyCursorIcon -Wl,-U,_winios_pDestroyWindow -Wl,-U,_winios_pProcessEvents -Wl,-U,_winios_pSetCursor -Wl,-U,_winios_pShowWindow -Wl,-U,_winios_pWindowPosChanged -Wl,-U,_winios_surface_present -Wl,-U,_winios_swapchain_drawable -Wl,-U,_winios_swapchain_hwnd -Wl,-U,_winios_swapchain_hwnd_at -Wl,-U,_winios_swapchain_slot_generation -Wl,-U,_winios_swapchain_take -Wl,-U,_winios_window_frame -Wl,-U,_winios_window_geometry -Wl,-U,_winios_window_lineage -Wl,-U,_winios_window_visibility -Wl,-U,_madeira_wmt_released_class"
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_C_LANGUAGE_STANDARD: gnu11
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        DEAD_CODE_STRIPPING: NO
        WARNING_CFLAGS: "-Wno-unused-function -Wno-deprecated-declarations"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  HarborUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Harbor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.harbor.cli.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        TEST_TARGET_NAME: Harbor
schemes:
  Harbor:
    build:
      targets:
        Harbor: all
        HarborUITests: [test]
    test:
      targets:
        - HarborUITests
