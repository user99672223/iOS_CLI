name: Harbor
options:
  bundleIdPrefix: app.harbor
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  HarborKit:
    path: Packages/HarborKit
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.20
  SwiftStreamingMarkdown:
    url: https://github.com/microsoft/SwiftStreamingMarkdown
    revision: 5f7c04e0558df6146f90d482edb62cb456986bda
targets:
  Harbor:
    type: application
    platform: iOS
    dependencies:
      - package: HarborKit
      - package: ZIPFoundation
      - package: SwiftStreamingMarkdown
    sources:
      - path: Sources
      - path: Runtime
        excludes: ["*.js"]
      - path: Runtime/madeira-jit.js
        buildPhase: resources
      - path: Resources/nls
        type: folder
        buildPhase: resources
      - path: Resources/aarch64-windows
        type: folder
        buildPhase: resources
      - path: Resources/prefix-template.tar.gz
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Harbor
        PRODUCT_BUNDLE_IDENTIFIER: app.harbor.cli
        INFOPLIST_FILE: Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Runtime/Harbor-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../out/$(PLATFORM_NAME)"
        OTHER_LDFLAGS: "-lntdll_unix -lwineserver -lwin32u_unix -lz -Wl,-headerpad_max_install_names"
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_C_LANGUAGE_STANDARD: gnu11
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        DEAD_CODE_STRIPPING: NO
        WARNING_CFLAGS: "-Wno-unused-function -Wno-deprecated-declarations"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  HarborUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Harbor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.harbor.cli.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        TEST_TARGET_NAME: Harbor
schemes:
  Harbor:
    build:
      targets:
        Harbor: all
        HarborUITests: [test]
    test:
      targets:
        - HarborUITests
